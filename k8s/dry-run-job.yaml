apiVersion: batch/v1
kind: Job
metadata:
  name: omero-storage-collector-dryrun
spec:
  backoffLimit: 0

  template:
    metadata:
      labels:
        app: omero-storage-collector

    spec:
      restartPolicy: Never

      containers:
        - name: collector
          image: image-registry.openshift-image-registry.svc:5000/core-omero-test/omero-storage-collector:latest
          imagePullPolicy: Always

          env:
            # OMERO source
            - name: OMERO_DB_HOST
              value: omero-postgres-server

            - name: OMERO_DB_PORT
              value: "5432"

            - name: OMERO_DB_NAME
              value: omerodb

            - name: OMERO_DB_USER
              valueFrom:
                secretKeyRef:
                  name: omero-stats-reader-secret
                  key: username

            - name: OMERO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omero-stats-reader-secret
                  key: password

            # filestatistics destination
            - name: STATS_DB_HOST
              value: filestatistics-pg15

            - name: STATS_DB_PORT
              value: "5432"

            - name: STATS_DB_NAME
              value: omerofilestats

            - name: STATS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: filestats-collector-secret
                  key: username

            - name: STATS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filestats-collector-secret
                  key: password